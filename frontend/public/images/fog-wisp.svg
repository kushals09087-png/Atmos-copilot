<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 400" width="2400" height="400" fill="none">
  <defs>
    <filter id="blurFog" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="36" />
    </filter>
    <linearGradient id="fogGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
  </defs>
  <g filter="url(#blurFog)">
    <!-- First half (0 to 1200) -->
    <ellipse cx="250" cy="260" rx="420" ry="110" fill="url(#fogGrad)" />
    <ellipse cx="680" cy="240" rx="460" ry="120" fill="url(#fogGrad)" />
    <ellipse cx="1080" cy="270" rx="380" ry="100" fill="url(#fogGrad)" />

    <!-- Second half seamless repeat (1200 to 2400) -->
    <ellipse cx="1450" cy="260" rx="420" ry="110" fill="url(#fogGrad)" />
    <ellipse cx="1880" cy="240" rx="460" ry="120" fill="url(#fogGrad)" />
    <ellipse cx="2280" cy="270" rx="380" ry="100" fill="url(#fogGrad)" />
  </g>
</svg>