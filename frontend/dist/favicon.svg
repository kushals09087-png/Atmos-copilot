  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#favJetBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="24" cy="24" r="17" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 3" stroke-opacity="0.25"/>
  
